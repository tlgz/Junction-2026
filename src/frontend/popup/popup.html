<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img src="../icons/logo_white.png" alt="" class="logo logo-dark" width="18" height="18" />
      <img src="../icons/logo_black.png" alt="" class="logo logo-light" width="18" height="18" />
      <span class="brand">Dnoise</span>
    </header>

    <main class="main">
      <button id="power" class="power" type="button" aria-pressed="true" aria-label="Toggle filtering">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <path d="M12 3v8" />
          <path d="M6.3 6.8a8 8 0 1 0 11.4 0" />
        </svg>
      </button>
      <p id="state" class="state">Filtering on</p>
      <p id="site" class="site">&nbsp;</p>
      <p id="count" class="count" hidden></p>
    </main>

    <section class="option">
      <div class="option-text">
        <label for="experimental" class="option-title">Experimental mode</label>
        <p class="option-desc">Filter every website, not just social media.</p>
      </div>
      <input id="experimental" type="checkbox" class="switch" role="switch" />
    </section>

    <button id="reload" class="reload" type="button" hidden>Reload page to apply</button>

    <script src="popup.js"></script>
  </body>
</html>
