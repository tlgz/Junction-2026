name: Release extension

# Builds dist/ on every push to main, zips it and publishes it as the latest
# GitHub Release. The landing page downloads it via the stable URL:
#   https://github.com/<owner>/<repo>/releases/latest/download/dnoise-extension.zip

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build extension
        run: npm run build

      - name: Stamp build version into manifest
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          node -e '
            const fs = require("fs");
            const p = "dist/manifest.json";
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            m.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n");
          ' "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Zip dist
        run: |
          mkdir -p release/dnoise-extension
          cp -r dist/. release/dnoise-extension/
          cd release && zip -r ../dnoise-extension.zip dnoise-extension

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create "v$VERSION" dnoise-extension.zip \
            --target "$GITHUB_SHA" \
            --title "Dnoise v$VERSION" \
            --notes "Automated build from ${SHORT_SHA}. Download dnoise-extension.zip, unzip it, and load the dnoise-extension folder via chrome://extensions → Load unpacked." \
            --latest
