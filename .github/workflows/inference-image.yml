name: Build inference image

# Builds inference/ into a Docker image (model baked in) and pushes it to GHCR.
# Deploy the printed sha-* tag on Verda (Containers -> New deployment).

on:
  push:
    branches: [main]
    paths:
      - "inference/**"
      - ".github/workflows/inference-image.yml"
  workflow_dispatch:
    inputs:
      model_revision:
        description: "Hugging Face model revision (branch or commit)"
        default: "main"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dnoise-inference

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (CUDA torch + model is ~8 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase) and tag
        id: meta
        run: |
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: inference
          push: true
          platforms: linux/amd64
          build-args: |
            MODEL_REVISION=${{ inputs.model_revision || 'main' }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Summary
        run: |
          echo "### Pushed \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Use this exact tag in the Verda deployment (not \`latest\`)." >> "$GITHUB_STEP_SUMMARY"
