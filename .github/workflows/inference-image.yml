name: Build inference image

# Builds inference/ into a Docker image (model baked in).
# Automatic push on main is disabled so repo changes do not overwrite or update
# the live Verda serverless container image unless manually triggered with push=true.

on:
  workflow_dispatch:
    inputs:
      model_revision:
        description: "Hugging Face model revision (branch or commit)"
        default: "main"
      push_image:
        description: "Push image to GHCR for Verda deployment"
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dnoise-inference

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (CUDA torch + model is ~8 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: ${{ inputs.push_image == true }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase) and tag
        id: meta
        run: |
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: inference
          push: ${{ inputs.push_image == true }}
          platforms: linux/amd64
          build-args: |
            MODEL_REVISION=${{ inputs.model_revision || 'main' }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Summary
        run: |
          if [ "${{ inputs.push_image }}" = "true" ]; then
            echo "### Pushed \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Use this exact tag in the Verda deployment (not \`latest\`)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Built \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\` (not pushed)" >> "$GITHUB_STEP_SUMMARY"
          fi
